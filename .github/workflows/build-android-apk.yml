name: Build Personal Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 55

    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare runner disk & Android SDK licenses
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          export SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sudo chown -R "$USER:$USER" "$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null || true
          df -h

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: app
        run: |
          sed -i 's|https://registry.npmmirror.com|https://registry.npmjs.org|g' package-lock.json
          npm ci || npm install --registry=https://registry.npmjs.org

      - name: Typecheck TypeScript
        working-directory: app
        run: npx tsc --noEmit

      - name: Generate native Android project (Expo Prebuild)
        working-directory: app
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure Gradle properties & Android SDK path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > app/android/local.properties
          sed -i 's/-Xmx2048m/-Xmx4096m/g' app/android/gradle.properties
          sed -i 's/MaxMetaspaceSize=512m/MaxMetaspaceSize=1024m/g' app/android/gradle.properties
          sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/g' app/android/gradle.properties
          sed -i 's/android.enableMinifyInReleaseBuilds=true/android.enableMinifyInReleaseBuilds=false/g' app/android/gradle.properties

      - name: Build Standalone Release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Copy & verify APK output
        run: |
          APK_PATH=$(find app/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" ./公考朱批录_v1.0.0.apk
          ls -lh ./公考朱批录_v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-kaogong-android-apk
          path: ./公考朱批录_v1.0.0.apk
          retention-days: 30

      - name: Publish Latest Pre-release on GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0-latest
          name: "公考朱批录 Android 安装包 (最新自动构建)"
          prerelease: true
          files: ./公考朱批录_v1.0.0.apk
